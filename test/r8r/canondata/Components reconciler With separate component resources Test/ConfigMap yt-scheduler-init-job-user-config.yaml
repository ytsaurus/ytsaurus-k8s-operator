  init-job-script.sh: |
    #!/bin/bash
    # YTsaurus init job script generated by ytsaurus-k8s-operator

    set -eux -o pipefail

    export YT_DRIVER_CONFIG_PATH=/config/client.yson
    /usr/bin/yt create user --attributes '{name="operation_archivarius"}' --ignore-existing
    /usr/bin/yt add-member operation_archivarius superusers || true
    while [ "$(/usr/bin/yt check-permission --format json operation_archivarius administer /)" != '{"action":"allow"}' ] ; do sleep 1 ; done
    /usr/bin/yt create map_node '//sys/cypress_tokens/885a9326e17d4a6182221351d148e4ee92d09760adaf10298af8778c84ca05ef' --ignore-existing
    /usr/bin/yt set '//sys/cypress_tokens/885a9326e17d4a6182221351d148e4ee92d09760adaf10298af8778c84ca05ef/@user' 'operation_archivarius'
