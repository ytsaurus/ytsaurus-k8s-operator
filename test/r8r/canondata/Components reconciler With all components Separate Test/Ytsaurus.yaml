apiVersion: cluster.ytsaurus.tech/v1
kind: Ytsaurus
metadata:
  generation: 3
  name: test-ytsaurus
  namespace: ytsaurus-components
  resourceVersion: "41"
spec:
  adminCredentials:
    name: test-ytsaurus-admin
  caBundle:
    name: ytsaurus-dev-ca.crt
  caRootBundle:
    items:
    - key: ca-certificates.crt
      path: ca-certificates.crt
    - key: ca-certificates.jks
      path: java/cacerts
    name: ytsaurus-dev-ca-root-bundle
  clusterFeatures:
    enableAnchorProfilingByDefault: true
    enableImageHeater: true
    httpProxyHaveChytAddress: true
    httpProxyHaveHttpsAddress: true
    rpcProxyHavePublicAddress: true
  configOverrides:
    name: test-overrides
  controllerAgents:
    instanceCount: 1
    locations:
    - locationType: Logs
      path: /yt/controller-agent-logs
    - locationType: InitJobLogs
      path: /yt/controller-agent-logs
    loggers:
    - minLogLevel: info
      name: info-stderr
      writerType: stderr
    - categoriesFilter:
        type: exclude
        values:
        - Bus
        - Concurrency
      compression: zstd
      format: plain_text
      minLogLevel: debug
      name: debug
      rotationPolicy:
        maxSegmentSize: 100Mi
        maxTotalSizeToKeep: 1Gi
      useDateTimeSuffix: true
      writerType: file
    minReadyInstanceCount: 0
    resources:
      limits:
        cpu: "1"
        memory: 2Gi
      requests:
        cpu: "0"
        memory: "0"
    volumeClaimTemplates:
    - metadata:
        name: controller-agent-logs
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    volumeMounts:
    - mountPath: /yt/controller-agent-logs
      name: controller-agent-logs
  coreImage: ghcr.io/ytsaurus/ytsaurus:stable-25.2.2
