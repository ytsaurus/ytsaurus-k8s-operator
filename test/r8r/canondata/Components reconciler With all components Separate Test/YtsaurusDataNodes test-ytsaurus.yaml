apiVersion: cluster.ytsaurus.tech/v1
kind: YtsaurusDataNodes
metadata:
  generation: 1
  name: test-ytsaurus
  namespace: ytsaurus-components
  resourceVersion: "2"
spec:
  instanceCount: 3
  locations:
  - locationType: ChunkStore
    path: /yt/node-data/chunk-store
  - locationType: Logs
    path: /yt/data-node-logs
  - locationType: InitJobLogs
    path: /yt/data-node-logs
  loggers:
  - minLogLevel: info
    name: info-stderr
    writerType: stderr
  - categoriesFilter:
      type: exclude
      values:
      - Bus
      - Concurrency
    compression: zstd
    format: plain_text
    minLogLevel: debug
    name: debug
    rotationPolicy:
      maxSegmentSize: 100Mi
      maxTotalSizeToKeep: 1Gi
    useDateTimeSuffix: true
    writerType: file
  minReadyInstanceCount: 0
  resources:
    limits:
      cpu: "1"
      memory: 2Gi
    requests:
      cpu: "0"
      memory: "0"
  volumeClaimTemplates:
  - metadata:
      name: node-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        limits:
          storage: 20Gi
        requests:
          storage: 10Gi
  - metadata:
      name: data-node-logs
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  volumeMounts:
  - mountPath: /yt/node-data
    name: node-data
  - mountPath: /yt/data-node-logs
    name: data-node-logs
  ytsaurus:
    name: test-ytsaurus
status:
  message: 'Pods are ready: 0 of 3, running 0, need 0'
  observedGeneration: 1
  state: Ready
