apiVersion: cluster.ytsaurus.tech/v1
kind: YtsaurusExecNodes
metadata:
  generation: 1
  name: test-ytsaurus
  namespace: ytsaurus-components
  resourceVersion: "2"
spec:
  instanceCount: 1
  jobEnvironment:
    cri:
      apiRetryTimeoutSeconds: 120
      criService: crio
      entrypointWrapper:
      - wrapper
      imagePullSecret:
        name: image-pull-secret
    nri:
      pluginDir: /usr/libexec/nri/plugins
      requestTimeout: 15s
  jobHttpsCertificateSecret:
    name: ytsaurus-job-https-cert
  jobNetwork:
    networkCapacity: 1000
    portCount: 1000
    startPort: 29000
  jobResources:
    limits:
      cpu: "4"
      memory: 8Gi
    requests:
      cpu: "0"
      memory: "0"
  locations:
  - locationType: ChunkCache
    path: /yt/node-data/chunk-cache
  - locationType: Slots
    path: /yt/node-data/slots
  - locationType: Logs
    path: /yt/exec-node-logs
  - locationType: InitJobLogs
    path: /yt/exec-node-logs
  - locationType: ImageCache
    path: /yt/node-data/image-cache
  loggers:
  - minLogLevel: info
    name: info-stderr
    writerType: stderr
  - categoriesFilter:
      type: exclude
      values:
      - Bus
      - Concurrency
    compression: zstd
    format: plain_text
    minLogLevel: debug
    name: debug
    rotationPolicy:
      maxSegmentSize: 100Mi
      maxTotalSizeToKeep: 1Gi
    useDateTimeSuffix: true
    writerType: file
  minReadyInstanceCount: 0
  privileged: false
  resources:
    limits:
      cpu: "1"
      memory: 2Gi
    requests:
      cpu: "0"
      memory: "0"
  volumeClaimTemplates:
  - metadata:
      name: node-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
  - metadata:
      name: exec-node-logs
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  volumeMounts:
  - mountPath: /yt/node-data
    name: node-data
  - mountPath: /yt/exec-node-logs
    name: exec-node-logs
  ytsaurus:
    name: test-ytsaurus
status:
  message: 'Pods are ready: 0 of 1, running 0, need 0'
  observedGeneration: 1
  state: Ready
