apiVersion: cluster.ytsaurus.tech/v1
kind: YtsaurusTabletNodes
metadata:
  generation: 1
  name: test-ytsaurus
  namespace: ytsaurus-components
  resourceVersion: "2"
spec:
  instanceCount: 3
  locations:
  - locationType: Logs
    path: /yt/tablet-node-logs
  - locationType: InitJobLogs
    path: /yt/tablet-node-logs
  loggers:
  - minLogLevel: info
    name: info-stderr
    writerType: stderr
  - categoriesFilter:
      type: exclude
      values:
      - Bus
      - Concurrency
    compression: zstd
    format: plain_text
    minLogLevel: debug
    name: debug
    rotationPolicy:
      maxSegmentSize: 100Mi
      maxTotalSizeToKeep: 1Gi
    useDateTimeSuffix: true
    writerType: file
  minReadyInstanceCount: 0
  resources:
    limits:
      cpu: "1"
      memory: 2Gi
    requests:
      cpu: "0"
      memory: "0"
  tabletCellSlots: 5
  volumeClaimTemplates:
  - metadata:
      name: tablet-node-logs
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  volumeMounts:
  - mountPath: /yt/tablet-node-logs
    name: tablet-node-logs
  ytsaurus:
    name: test-ytsaurus
status:
  message: Ready
  observedGeneration: 1
  state: Ready
