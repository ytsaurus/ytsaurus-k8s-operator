name: "E2E Tests"

on:
  workflow_call:
    inputs:
      e2e_filter:
        type: string
        required: false
        default: ""
      FOCUS:
        type: string
        required: false
        default: ""
      DEBUG:
        type: string
        required: false
        default: ""
      TEST_YTSAURUS_VERSION:
        type: string
        required: false
        default: ""

  workflow_dispatch:
    inputs:
      e2e_filter:
        description: "E2E tests filter"
        type: string
        required: false
        default: ""
      FOCUS:
        description: "Filter tests by regular expression"
        type: string
        required: false
        default: ""
      DEBUG:
        description: "Enable DEBUG: 1|asan|msan|race|fail"
        type: string
        required: false
        default: ""
      TEST_YTSAURUS_VERSION:
        description: "YTsaurus version or epoch"
        type: string
        required: false
        default: ""

env:
  TEST_YTSAURUS_VERSION: "${{ inputs.TEST_YTSAURUS_VERSION }}"
  GINKGO_PROCS: "2"
  GINKGO_TIMEOUT: "2h"

jobs:
  check:
    name: "Check ${{ matrix.e2e.name }} e2e tests"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        e2e:
          - name: "update basic"
            filter: "update && basic"
          - name: "update plan"
            filter: "update && plan"
          - name: "update other"
            filter: "update && !(basic || plan || multicell)"
          - name: "tls"
            filter: "tls"
          - name: "multicell"
            filter: "multicell"
          - name: "other"
            filter: "!(update || tls || multicell)"
          - name: "${{ inputs.e2e_filter || inputs.FOCUS }}"
            filter: "${{ inputs.e2e_filter }}"
            from_input: true
        exclude:
          - e2e:
              # run only from_input part when defined and vice versa
              from_input: ${{ ( ! inputs.e2e_filter && ! inputs.FOCUS ) && true || '' }}

    steps:
      # https://github.com/jlumbroso/free-disk-space
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          large-packages: false

      # https://github.com/actions/checkout
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1

      # https://github.com/actions/setup-go
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: |
            **/go.mod
            ${{ job.workflow_file_path }}

      # https://github.com/Azure/setup-helm
      # https://github.com/helm/helm/releases
      - name: Set up Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: v3.18.6

      - name: Build YTsaurus operator
        shell: bash
        run: |
          make build

      - name: Setup k8s cluster
        shell: bash
        run: |
          make kind-create-cluster

      - name: Install YTsaurus operator
        shell: bash
        run: |
          make helm-kind-install
          kubectl get pod -A

      - name: Run ${{ matrix.e2e.name }} e2e tests
        env:
          GINKGO_LABEL_FILTER: ${{ matrix.e2e.filter }}
          FOCUS: ${{ inputs.FOCUS }}
          DEBUG: ${{ inputs.DEBUG }}
        shell: bash
        run: |
          make test-e2e

      - name: Make logs snapshot
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          make logs-snapshot

      - name: Cleanup k8s cluster
        shell: bash
        run: |
          make helm-uninstall
          make kind-delete-cluster

      # https://github.com/actions/upload-artifact
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: "Report for E2E tests ${{ matrix.e2e.name }}"
          path: "report.xml"
          retention-days: 10

      # https://github.com/actions/upload-artifact
      - name: Upload logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: "Logs from E2E tests ${{ matrix.e2e.name }}"
          path: "logs/"
          retention-days: 10

  report:
    name: "Report test results"
    if: ${{ !cancelled() }}
    needs: check
    runs-on: ubuntu-latest
    steps:
      # https://github.com/dorny/test-reporter
      - name: Report results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          report-title: "E2E Tests"
          artifact: "/Report (.*)/"
          name: "Results $1"
          path: "report.xml"
          reporter: "java-junit"
          list-suites: "all"
          list-tests: "failed"
          collapsed: "auto"
          max-annotations: "20"
          fail-on-error: "false"
