name: Build nightly release

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  release:
    name: Run release
    uses: ./.github/workflows/subflow_release.yaml
    secrets: inherit
    with:
      release_version: $(git show -s --date=format:%y%m%d%H%M --abbrev=16 --pretty=0.0.%cd-dev-%h)
      release_suffix: "-nightly"
