name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+'

jobs:
  release:
    name: Run release
    uses: ./.github/workflows/subflow_release.yaml
    secrets: inherit
    with:
      release_version: ${GITHUB_REF#refs/tags/v}

  # https://go.dev/doc/modules/managing-source?#multiple-module-source
  tag-api-module:
    name: Tag API module
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Create API module release tag
        env:
          API_TAG: api/${{ github.ref_name }}
        run: |
          git tag "${API_TAG}" "${GITHUB_SHA}"
          git push origin "${API_TAG}"
