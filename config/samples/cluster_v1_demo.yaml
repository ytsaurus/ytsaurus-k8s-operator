# yaml-language-server: $schema=https://raw.githubusercontent.com/ytsaurus/ytsaurus-k8s-operator/refs/heads/main/config/crd/schema/cluster.ytsaurus.tech_ytsaurus_v1.json

apiVersion: cluster.ytsaurus.tech/v1
kind: Ytsaurus
metadata:
  name: ytdemo
spec:
  # https://ytsaurus.tech/docs/en/admin-guide/releases#ytsaurus-server
  # remove "-relwithdebinfo" for image without debug symbols
  coreImage: ghcr.io/ytsaurus/ytsaurus:stable-25.2.2-relwithdebinfo

  # Allow updating everything at once
  updatePlan:
    - class: Everything

  uiImage: ghcr.io/ytsaurus/ui:stable

  # Secret with login, password and token for administrator.
  adminCredentials:
    name: ytadminsec

  discovery:
    instanceCount: 1

  primaryMasters:
    instanceCount: 3
    cellTag: 1
    volumeMounts:
      - name: master-data
        mountPath: /yt/master-data
    locations:
      - locationType: MasterChangelogs
        path: /yt/master-data/master-changelogs
      - locationType: MasterSnapshots
        path: /yt/master-data/master-snapshots

    volumeClaimTemplates:
      - metadata:
          name: master-data
        spec:
          accessModes: [ "ReadWriteOnce" ]
          resources:
            requests:
              storage: 20Gi

  httpProxies:
    - serviceType: NodePort
      instanceCount: 3

  rpcProxies:
    - serviceType: LoadBalancer
      instanceCount: 3

  dataNodes:
    - instanceCount: 3
      volumeMounts:
        - name: node-data
          mountPath: /yt/node-data

      locations:
        - locationType: ChunkStore
          path: /yt/node-data/chunk-store

      volumeClaimTemplates:
        - metadata:
            name: node-data
          spec:
            accessModes: [ "ReadWriteOnce" ]
            resources:
              requests:
                storage: 50Gi

  execNodes:
    - instanceCount: 3
      resources:
        limits:
          cpu: 3
          memory: 5Gi

      volumeMounts:
        - name: node-data
          mountPath: /yt/node-data

      volumes:
        - name: node-data
          emptyDir:
            sizeLimit: 40Gi

      locations:
        - locationType: ChunkCache
          path: /yt/node-data/chunk-cache
        - locationType: Slots
          path: /yt/node-data/slots

      jobProxyLoggers:
        - name: debug
          compression: zstd
          minLogLevel: debug
          writerType: file
          useTimestampSuffix: true
          rotationPolicy: &rotationPolicy
            maxTotalSizeToKeep: 100Mi
            maxSegmentSize: 10Mi
            rotationPeriodMilliseconds: 900000
            maxSegmentCountToKeep: 100
          categoriesFilter:
            type: exclude
            values: [ "Bus", "Concurrency" ]
        - name: info
          minLogLevel: info
          writerType: file
          useDateTimeSuffix: true
          rotationPolicy: *rotationPolicy
        # this file is append-only and not rotated
        # - name: stderr
        #   minLogLevel: warning
        #   writerType: stderr

  tabletNodes:
    - instanceCount: 3

  queryTrackers:
    # https://ytsaurus.tech/docs/en/admin-guide/releases#query-tracker
    # append "-relwithdebinfo" for image with debug symbols
    image: ghcr.io/ytsaurus/query-tracker:0.1.2
    instanceCount: 1

  yqlAgents:
    # https://ytsaurus.tech/docs/en/admin-guide/releases#query-tracker
    # append "-relwithdebinfo" for image with debug symbols
    image: ghcr.io/ytsaurus/query-tracker:0.1.2
    instanceCount: 1

  schedulers:
    instanceCount: 1

  controllerAgents:
    instanceCount: 1

  ui:
    serviceType: NodePort
    instanceCount: 1

  strawberry:
    image: ghcr.io/ytsaurus/strawberry:0.0.17
    resources:
      limits:
        memory: 100Mi

---
apiVersion: v1
kind: Secret
metadata:
  name: ytadminsec
type: Opaque
data:
  login: YWRtaW4=         # admin
  password: cGFzc3dvcmQ=  # password
  token: cGFzc3dvcmQ=     # password
